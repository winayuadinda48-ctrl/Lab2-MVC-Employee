<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Data Employee</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 900px;">
        
        <!-- Kartu Form Tambah -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-header bg-primary text-white fw-bold fs-5">
                Tambah Employee Baru
            </div>
            <div class="card-body">
                <form action="/employees/add" method="POST">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Nama</label>
                            <input type="text" name="name" class="form-control" placeholder="Masukkan nama" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Posisi</label>
                            <input type="text" name="position" class="form-control" placeholder="Contoh: Manager" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Gaji (Rp)</label>
                            <input type="number" name="salary" class="form-control" value="0" required>
                        </div>
                    </div>
                    <div class="text-end mt-3">
                        <button type="submit" class="btn btn-success fw-bold px-4">Simpan Data</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Kartu Tabel Daftar Employee -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold fs-5">
                Daftar Employee
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Nama</th>
                            <th>Posisi</th>
                            <th>Gaji</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for emp in employees %}
                        <tr>
                            <td class="ps-3"><span class="badge bg-secondary">#{{ emp.id }}</span></td>
                            <td class="fw-bold">{{ emp.name }}</td>
                            <td>{{ emp.position }}</td>
                            <td class="text-success fw-bold">Rp{{ "{:,.0f}".format(emp.salary) }}</td>
                            <td class="text-center">
                                <a href="#" class="btn btn-warning btn-sm fw-bold">Edit</a>
                                <a href="#" class="btn btn-danger btn-sm fw-bold">Hapus</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
